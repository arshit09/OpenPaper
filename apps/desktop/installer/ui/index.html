<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenPaper Setup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <!-- lucide (ISC), the set the website and editor use -->
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 6v7" /><path d="M12 18h.01" /></symbol>
    </svg>

    <header class="titlebar" data-tauri-drag-region>
      <div class="controls">
        <button class="ctl" type="button" id="minimize" aria-label="Minimize"><svg class="i"><use href="#i-minus" /></svg></button>
        <button class="ctl" type="button" id="close" aria-label="Close"><svg class="i"><use href="#i-x" /></svg></button>
      </div>
    </header>

    <!-- The app icon heads every view; its badge says how things went. -->
    <div class="tile" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path fill="#fff" d="M25.01 1.19A30.86 30.86 0 1 0 62.81 38.99Z" /><path fill="#8c8c8c" d="M25.01 1.19A30.86 30.86 0 0 0 62.81 38.99Z" /></svg>
      <span class="badge ok"><svg class="i"><use href="#i-check" /></svg></span>
      <span class="badge bad"><svg class="i"><use href="#i-alert" /></svg></span>
    </div>

    <main class="content">
      <!-- Install -->
      <section class="view" data-view="install" hidden>
        <h1>OpenPaper</h1>
        <p class="sub" id="release-line">Checking for the latest version…</p>

        <div class="card">
          <div class="row">
            <span class="label">Install to</span>
            <span class="value path" id="dir"></span>
            <button class="link" type="button" id="change">Change</button>
          </div>
          <label class="row">
            <span class="label">Desktop shortcut</span>
            <input class="switch" type="checkbox" id="desktop" checked />
          </label>
        </div>

        <label class="consent">
          <input type="checkbox" id="agree" />
          <span>I agree to the <a href="#" data-legal="terms">Terms of Use</a> and <a href="#" data-legal="privacy">Privacy Policy</a></span>
        </label>
        <footer class="actions">
          <button class="btn btn-solid" type="button" id="install" disabled>Install</button>
        </footer>
      </section>

      <!-- Installing, updating, removing -->
      <section class="view" data-view="progress" hidden>
        <h1 id="progress-title"></h1>
        <p class="sub" id="progress-sub"></p>

        <div class="progress">
          <div class="progress-text">
            <span id="status"></span>
            <span class="percent" id="percent"></span>
          </div>
          <div class="bar" aria-hidden="true"><span id="bar"></span></div>
        </div>

        <footer class="actions">
          <button class="btn btn-ghost" type="button" id="cancel">Cancel</button>
        </footer>
      </section>

      <!-- Installed -->
      <section class="view" data-view="done" hidden>
        <h1>OpenPaper is ready</h1>
        <p class="sub" id="done-sub"></p>
        <footer class="actions">
          <button class="btn btn-ghost" type="button" data-action="close">Close</button>
          <button class="btn btn-solid" type="button" id="launch">Open OpenPaper</button>
        </footer>
      </section>

      <!-- Uninstall -->
      <section class="view" data-view="uninstall" hidden>
        <h1>Uninstall OpenPaper?</h1>
        <p class="sub" id="uninstall-sub">This removes the app from this PC.</p>
        <div class="card">
          <label class="row">
            <span class="row-text">
              <span>Also delete my designs and settings</span>
              <span class="path" id="data-dir"></span>
            </span>
            <input class="switch" type="checkbox" id="remove-data" />
          </label>
        </div>
        <footer class="actions">
          <button class="btn btn-ghost" type="button" data-action="close">Cancel</button>
          <button class="btn btn-solid" type="button" id="uninstall">Uninstall</button>
        </footer>
      </section>

      <!-- Uninstalled -->
      <section class="view" data-view="removed" hidden>
        <h1>OpenPaper was removed</h1>
        <p class="sub" id="removed-sub"></p>
        <footer class="actions">
          <button class="btn btn-solid" type="button" data-action="close">Close</button>
        </footer>
      </section>

      <!-- Error -->
      <section class="view" data-view="error" hidden>
        <h1>Setup stopped</h1>
        <p class="error-text" id="error-text"></p>
        <footer class="actions">
          <button class="btn btn-ghost" type="button" data-action="close">Close</button>
          <button class="btn btn-solid" type="button" id="retry">Try again</button>
        </footer>
      </section>
    </main>

    <!-- Terms and privacy -->
    <div class="sheet-backdrop" id="legal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Terms of Use and Privacy Policy">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="terms">Terms of Use</button>
          <button type="button" role="tab" data-tab="privacy">Privacy Policy</button>
        </div>
        <div class="sheet-body" id="legal-body"></div>
        <footer class="sheet-actions">
          <span class="meta">Last updated November 19, 2026</span>
          <button class="btn btn-solid btn-sm" type="button" id="legal-done">Done</button>
        </footer>
      </div>
    </div>

    <template id="terms">
      <h2>Terms of Use</h2>
      <p>OpenPaper is free, open-source software. By installing it you agree to these terms.</p>
      <h3>1. The license</h3>
      <p>OpenPaper is released under the <a href="https://github.com/arshit09/OpenPaper/blob/main/LICENSE" target="_blank">MIT License</a>. You may use, copy, change and share it under that license.</p>
      <h3>2. No warranty</h3>
      <p>OpenPaper is provided "as is", without warranty of any kind. To the extent the law allows, its authors aren't liable for any claim, damage or loss that comes from using it. Keep backups of work that matters to you.</p>
      <h3>3. Your work is yours</h3>
      <p>You own the designs you make. They are saved as files on your computer, and the authors of OpenPaper never receive them.</p>
      <h3>4. Services you connect</h3>
      <p>Some features use services you choose to connect, such as Anthropic, OpenAI, Google, Figma or Hugging Face. Their own terms apply when you use them, and any charges from them are yours.</p>
      <h3>5. Using it responsibly</h3>
      <p>Only use fonts, images and other content you have the right to use, and don't use OpenPaper to break the law or infringe anyone's rights.</p>
      <h3>6. An independent project</h3>
      <p>OpenPaper isn't affiliated with or endorsed by Paper, Figma, Anthropic, OpenAI or Google. Their names are trademarks of their owners and are used only to describe compatibility.</p>
      <h3>7. Downloads and changes</h3>
      <p>This installer downloads OpenPaper from the project's <a href="https://github.com/arshit09/OpenPaper/releases" target="_blank">GitHub releases</a>. These terms may change in later versions; each version comes with the terms that apply to it.</p>
    </template>

    <template id="privacy">
      <h2>Privacy Policy</h2>
      <p>Your files, your machine. OpenPaper has no accounts, no cloud sync, and no analytics or telemetry.</p>
      <h3>What stays on your computer</h3>
      <p>Designs, images and settings live in one folder you control, <code>%USERPROFILE%\.openpaper</code>, and exports go to <code>Downloads\OpenPaper</code>. The local server only listens on 127.0.0.1 and refuses requests from other websites. API keys you add are stored in <code>config.json</code>, readable only by you, and never sent to the editor.</p>
      <h3>What goes online, and when</h3>
      <ul>
        <li><strong>GitHub</strong>, to check for a new version when OpenPaper opens and every six hours, and to download it when you update. It only reads the release's version file: GitHub sees your IP address and which version you have, nothing about your designs.</li>
        <li><strong>Google Fonts</strong>, for the Google fonts your designs use.</li>
        <li><strong>Anthropic</strong>, when you use the built-in design agent, with your key or your own Claude Code sign-in.</li>
        <li><strong>OpenAI or Gemini</strong>, when an agent generates an image with your key.</li>
        <li><strong>Figma</strong>, when you paste from Figma with a token set, to fetch its images.</li>
        <li><strong>Hugging Face</strong>, once, when you turn on voice input, to download the speech model. Your speech is transcribed on your computer.</li>
        <li><strong>Image hosts</strong>, when a design uses an image by its web address; it's downloaded once into your media folder.</li>
        <li><strong>Your live sites</strong>, through a local proxy, when you open one.</li>
      </ul>
      <h3>Agents</h3>
      <p>External agents such as Claude Code talk to OpenPaper on your machine. What they send to their own model provider is governed by that agent and its provider.</p>
      <h3>This installer</h3>
      <p>It downloads OpenPaper from GitHub, which sees your IP address as with any download (<a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" target="_blank">GitHub's privacy statement</a> applies). It sends nothing else anywhere.</p>
    </template>

    <script src="app.js"></script>
  </body>
</html>
