# OpenPaper for Windows: the desktop app (OpenPaper.exe) and its small web installer (OpenPaper Setup.exe).
[workspace]
members = ["common", "app", "installer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arshit09/OpenPaper"

[workspace.dependencies]
openpaper-common = { path = "common" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Both binaries ship to users: small and fast beats quick to compile.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
